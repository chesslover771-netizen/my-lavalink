server:
  port: 10000
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  plugins:
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3"
      snapshot: true
  server:
    password: "nilavsupersecretpassword"
    playerUpdateInterval: 5
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: false
      vimeo: false
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    oauth:
      enabled: true
      refreshToken: "1//0goErnl6fN_ngCgYIARAAGBASNwF-L9IrmoluomwP6aDqasgVID6TpMB0WMVM0yIw_qqPdxVXUOPFTQHeK2TXGNR9Uc-n07ctG8I"
      skipInitialization: true
    clients:
      - TV
      - ANDROID_VR
      - ANDROID_MUSIC
      - WEB
  lavasrc:
    providers:
      - "scsearch:%QUERY%"
      - "scsearch:\"%ISRC%\""
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: true
      deezer: false
    applemusic:
      countryCode: "IN"
      playlistLoadLimit: 3
      albumLoadLimit: 2
